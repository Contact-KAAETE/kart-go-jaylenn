<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kart Go mobiele functionele controles</title><style>body{margin:20px;background:#18372b;color:#eef7dc;font:14px system-ui}main{display:flex;gap:24px;align-items:flex-start}section{max-width:650px}button,select{padding:11px;margin:4px;border:0;border-radius:8px;cursor:pointer}button{background:#caec87;color:#173b2c}iframe{border:3px solid #9cbc77;border-radius:18px;flex-shrink:0}pre{white-space:pre-wrap;background:#0f2b20;padding:15px;border-radius:10px;font-size:12px}h1{font-size:22px}small{color:#b9d49b}</style><h1>Kart Go — functionele mobiele controle</h1><main><iframe id="phone" title="Spel op telefoonformaat" width="390" height="844" src="./index.html?qa=1"></iframe><section><p>Deze testpagina gebruikt de echte spelcode. Pointer-events worden synthetisch aangeboden; dit is geen fysieke iPhone.</p><select id="size" aria-label="Schermformaat"><option value="390,844">iPhone 390 × 844</option><option value="320,568">Klein 320 × 568</option><option value="375,667">iPhone 375 × 667</option><option value="430,932">Groot 430 × 932</option><option value="844,390">Liggend 844 × 390</option></select><button id="rotate">Draai scherm</button><button id="reload">Heropen spel</button><p><button data-action="multitouch">Test gelijktijdige touchbediening</button><button data-action="analog">Test stuurwiel en joystick</button><button data-action="pickup">Zet Lucky Block voor de kart</button><button data-action="items">Vul drie power-ups</button><button data-action="finish">Race naar de finish</button><button data-action="boss">Test eindbaasrace</button><button data-action="ice">Test ijs-treffer</button><button data-action="jumpIce">Test Jump tegen ijs</button><button data-action="bridge">Bekijk brug</button><button data-action="tunnel">Bekijk tunnel</button><button data-action="layout">Controleer overlap</button></p><small>Actuele DOM-status en testresultaten:</small><pre id="report">Spel wordt geladen.</pre><pre id="results"></pre></section></main><script>
const frame=document.querySelector('#phone'),report=document.querySelector('#report'),results=document.querySelector('#results');
frame.addEventListener('load',()=>{const script=frame.contentDocument.createElement('script');script.src='./qa-driver.js';frame.contentDocument.body.append(script)});
for(const button of document.querySelectorAll('[data-action]'))button.onclick=()=>frame.contentWindow.postMessage({source:'kartgo-local-qa',action:button.dataset.action},location.origin);
function setSize(w,h){frame.width=w;frame.height=h;frame.contentWindow.postMessage({source:'kartgo-local-qa',action:'layout'},location.origin)}
document.querySelector('#size').onchange=e=>setSize(...e.target.value.split(',').map(Number));document.querySelector('#rotate').onclick=()=>setSize(+frame.height,+frame.width);document.querySelector('#reload').onclick=()=>frame.contentWindow.location.reload();
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin)return;if(e.data.type==='status')report.textContent=JSON.stringify(e.data.value,null,2);if(e.data.type==='result')results.textContent+=e.data.text+'\n'});
</script></html>
