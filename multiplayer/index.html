<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kart Go — Samen racen (test)</title><style>body{font:17px system-ui;background:#112c2a;color:white;margin:0;padding:20px}main{max-width:680px;margin:auto}button,input{font:inherit;padding:13px;border-radius:12px;border:0;margin:5px 0}button{background:#fbd451;color:#102521;font-weight:700}input{width:calc(100% - 30px)}.card{background:#21433e;padding:16px;border-radius:16px;margin:12px 0}.hidden{display:none}canvas{width:100%;background:#325c3d;border-radius:14px}small{color:#c8e3d9}#log{white-space:pre-wrap}</style><main><a href="../" style="color:#fff">← Terug naar Kart Go</a><h1>🏎️ Samen racen</h1><p><strong>Testversie:</strong> online race met maximaal 6 spelers. De 70 originele levels blijven ongewijzigd.</p><div class="card"><label>Je racenaam<input id="name" maxlength="18" placeholder="Coureur"></label><button id="create">Maak racekamer</button><p>Of vul de code van een vriend in:</p><input id="room" maxlength="8" placeholder="KAMERCODE"><input id="secret" placeholder="Uitnodigingssleutel"><button id="join">Doe mee</button><small>De organisator deelt zowel de kamercode als de uitnodigingssleutel.</small></div><div id="lobby" class="card hidden"><h2>Racekamer <span id="roomLabel"></span></h2><button id="share">Deel uitnodiging</button><p id="players"></p><button id="ready">Ik ben klaar</button><button id="start">Start race (organisator)</button></div><div id="race" class="card hidden"><h2>Race bezig!</h2><canvas id="track" width="500" height="350"></canvas><p id="result"></p><button id="left">◀ Links</button><button id="gas">GAS</button><button id="right">Rechts ▶</button><p><small>Houd gas en stuurknoppen ingedrukt.</small></p></div><p id="log" role="status"></p></main><script>
const API='https://kart-go-jaylenn.thijs30051970.workers.dev';let ws,me,host=false,ready=false,players=[],controls={gas:false,steer:0},interval;const $=id=>document.getElementById(id),say=t=>$('log').textContent=t;const params=new URLSearchParams(location.search);if(params.has('room'))$('room').value=params.get('room');if(params.has('key'))$('secret').value=params.get('key');function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o))}function connect(room,key){ws=new WebSocket(API.replace('https:','wss:')+'/rooms/'+room+'/connect?secret='+encodeURIComponent(key));ws.onopen=()=>{say('Verbonden met de racekamer');send({type:'profile',name:$('name').value||'Coureur',avatar:0,color:Math.floor(Math.random()*12)});$('lobby').classList.remove('hidden');$('roomLabel').textContent=room};ws.onerror=()=>say('Verbinding mislukt. Controleer de uitnodiging.');ws.onclose=()=>{say('Verbinding gesloten');clearInterval(interval)};ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='welcome')me=m.id;if(m.type==='lobby'){players=m.players;$('players').textContent=players.map(p=>(p.ready?'✅ ':'◯ ')+p.name).join(' · ');$('start').disabled=!m.canStart}if(m.type==='countdown'){say('Start over 3 seconden!');$('race').classList.remove('hidden');interval=setInterval(()=>send({type:'input',...controls}),100)}if(m.type==='snapshot')draw(m.players,m.length);if(m.type==='results'){$('result').textContent='Uitslag: '+m.players.map((p,i)=>(i+1)+'. '+p.name).join(' · ');clearInterval(interval)}}}function draw(ps,len){const c=$('track'),g=c.getContext('2d');g.clearRect(0,0,500,350);g.fillStyle='#555';g.fillRect(80,15,340,320);g.fillStyle='white';g.font='15px system-ui';g.fillText('START',90,332);g.fillText('FINISH',90,32);ps.forEach((p,i)=>{g.fillStyle=['#ff6868','#70ccff','#ffe069','#f4a1ff','#aaff91','#ffffff'][i%6];let x=250+p.x*135,y=320-p.d/len*290;g.fillRect(x-11,y-17,22,34);g.fillStyle='white';g.fillText(p.name,x-20,y-22)})} $('create').onclick=async()=>{try{let r=await fetch(API+'/rooms',{method:'POST'}),j=await r.json();if(!r.ok)throw Error(j.error);host=true;$('room').value=j.room;$('secret').value=j.secret;connect(j.room,j.secret)}catch(e){say('Kamer maken mislukt: '+e.message)}};$('join').onclick=()=>{if($('room').value.length!==8||!$('secret').value)return say('Vul de kamercode en uitnodigingssleutel in.');connect($('room').value.toUpperCase(),$('secret').value)};$('share').onclick=async()=>{const url=location.origin+location.pathname+'?room='+encodeURIComponent($('room').value)+'&key='+encodeURIComponent($('secret').value);try{if(navigator.share)await navigator.share({title:'Kart Go race-uitnodiging',url});else{await navigator.clipboard.writeText(url);say('Uitnodiging gekopieerd!')}}catch{say('Deel deze link: '+url)}};$('ready').onclick=()=>{ready=!ready;send({type:'ready',ready});$('ready').textContent=ready?'Niet klaar':'Ik ben klaar'};$('start').onclick=()=>{if(!host)return say('Alleen de organisator kan starten.');send({type:'start'})};function bind(id,down,up){let el=$(id);for(let ev of ['pointerdown'])el.addEventListener(ev,e=>{e.preventDefault();el.setPointerCapture(e.pointerId);down()});for(let ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,up)}bind('gas',()=>controls.gas=true,()=>controls.gas=false);bind('left',()=>controls.steer=-1,()=>controls.steer=0);bind('right',()=>controls.steer=1,()=>controls.steer=0);
</script></html>
