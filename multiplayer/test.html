<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kart Go — multiplayer test</title><style>body{font:18px system-ui;background:#10243c;color:white;max-width:680px;margin:auto;padding:20px}button,input{font:inherit;padding:12px;border-radius:10px;margin:5px}button{background:#ffce39;border:0}canvas{background:#426b4b;border-radius:14px;width:100%;touch-action:none}.row{display:flex;flex-wrap:wrap;gap:10px}#status{min-height:2em}</style><h1>🏎️ Kart Go — 6 spelers</h1><p>Afzonderlijke multiplayer-proef. Nog niet de originele Kart Go-banen of power-ups.</p><label>Serveradres (Cloudflare Worker)<input id="server" placeholder="https://jouw-worker.workers.dev" size="32"></label><div class="row"><button id="create">Maak kamer</button><input id="invite" placeholder="Plak uitnodigingslink" size="26"><button id="join">Doe mee</button></div><label>Naam <input id="name" maxlength="18" value="Coureur"></label><label>Kleur <input id="color" type="color" value="#ffb933"></label><button id="ready" disabled>Ik ben klaar</button><button id="start" disabled>Start race</button><p id="status" role="status">Nog niet verbonden.</p><p id="members"></p><canvas id="track" width="640" height="360"></canvas><div class="row"><button id="left">⬅️ Links</button><button id="gas">🏁 Gas</button><button id="right">Rechts ➡️</button></div><script>
const $=id=>document.getElementById(id),ctx=$('track').getContext('2d');let socket,myId,players=[],length=1800,gas=false,steer=0,started=false;
$('server').value=localStorage.getItem('kartgo-test-server')||'';
function status(t){$('status').textContent=t}
function connect(endpoint,secret){socket=new WebSocket(endpoint+'?secret='+encodeURIComponent(secret));socket.onopen=()=>{status('Verbonden. Kies je naam en klik Ik ben klaar.');socket.send(JSON.stringify({type:'profile',name:$('name').value,color:0,avatar:0}));$('ready').disabled=false};socket.onerror=()=>status('Verbinding mislukt. Controleer serveradres en uitnodiging.');socket.onclose=()=>{status('Verbinding verbroken');$('ready').disabled=true};socket.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='welcome')myId=m.id;if(m.type==='lobby'){players=m.players;$('members').textContent=players.map(p=>p.name+(p.ready?' ✓':'')).join(' · ');$('start').disabled=!m.canStart}if(m.type==='countdown'){status('Start over 3 seconden!');setTimeout(()=>{started=true;status('RACEN!')},3000)}if(m.type==='snapshot'){players=m.players;length=m.length;draw()}if(m.type==='results'){started=false;status('Finish! '+m.players.map((p,i)=>i+1+'. '+p.name).join(' · '))}}}
$('create').onclick=async()=>{try{const base=$('server').value.replace(/\/$/,'');localStorage.setItem('kartgo-test-server',base);const r=await fetch(base+'/rooms',{method:'POST'});if(!r.ok)throw Error('Server reageert niet');const d=await r.json();const link=location.href.split('?')[0]+'?endpoint='+encodeURIComponent(d.endpoint)+'&secret='+encodeURIComponent(d.secret);$('invite').value=link;status('Deel de link met maximaal vijf vrienden.');connect(d.endpoint,d.secret)}catch(e){status('Kamer maken mislukt: '+e.message)}};
$('join').onclick=()=>{try{const u=new URL($('invite').value);connect(u.searchParams.get('endpoint'),u.searchParams.get('secret'))}catch{status('Geen geldige uitnodigingslink')}};
$('ready').onclick=()=>{socket?.send(JSON.stringify({type:'profile',name:$('name').value,avatar:0,color:0}));socket?.send(JSON.stringify({type:'ready',ready:true}));status('Klaar! Wacht op de andere spelers.')};
$('start').onclick=()=>socket?.send(JSON.stringify({type:'start'}));
function input(){if(socket?.readyState===1&&started)socket.send(JSON.stringify({type:'input',gas,steer}))}setInterval(input,100);
for(const [id,on,off] of [['gas',()=>gas=true,()=>gas=false],['left',()=>steer=-1,()=>steer=0],['right',()=>steer=1,()=>steer=0]]){const b=$(id);b.onpointerdown=e=>{e.preventDefault();on()};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>off()}
window.onkeydown=e=>{if(e.key==='ArrowUp'||e.key===' ')gas=true;if(e.key==='ArrowLeft')steer=-1;if(e.key==='ArrowRight')steer=1};window.onkeyup=e=>{if(e.key==='ArrowUp'||e.key===' ')gas=false;if(['ArrowLeft','ArrowRight'].includes(e.key))steer=0};
function draw(){ctx.fillStyle='#426b4b';ctx.fillRect(0,0,640,360);ctx.fillStyle='#555';ctx.fillRect(70,25,500,310);ctx.strokeStyle='white';ctx.setLineDash([12,12]);for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(70+i*125,25);ctx.lineTo(70+i*125,335);ctx.stroke()}ctx.setLineDash([]);for(const [i,p] of players.entries()){const y=320-(p.d/length)*280,x=130+(p.x+1)*175;ctx.fillStyle=['#ffcf3d','#35cbf3','#ff6c84','#a5fa7a','#d3a6ff','#fff'][i%6];ctx.fillRect(x-14,y-19,28,38);ctx.fillStyle='white';ctx.font='14px system-ui';ctx.fillText(p.name.slice(0,10),x-25,y-24)}}draw();const params=new URLSearchParams(location.search);if(params.has('endpoint')&&params.has('secret')){$('invite').value=location.href;status('Klik Doe mee om de kamer te openen.')}
</script></html>
